# Replace threatintel.local and certificate paths for your environment.
server {
    listen 80;
    server_name threatintel.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name threatintel.local;

    ssl_certificate     /etc/nginx/ssl/threatintel.crt;
    ssl_certificate_key /etc/nginx/ssl/threatintel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/threatintel;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
